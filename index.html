<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>空间系统快速生成器</title>
  <style>
    :root {
      --panel: rgba(248, 250, 252, 0.92);
      --ink: #172033;
      --muted: #5c6677;
      --line: rgba(23, 32, 51, 0.16);
      --blue: #2f80ed;
      --cyan: #16a6c9;
      --red: #e24b4b;
      --gold: #c79c22;
      --violet: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background: #d8dde5;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 4;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.16);
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(6, minmax(88px, 1fr));
      gap: 8px;
      width: min(620px, calc(100vw - 28px));
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.16);
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
    }

    button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      font: 600 13px/1.2 Inter, "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: #ffffff;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    button:hover,
    button.active {
      border-color: rgba(47, 128, 237, 0.32);
      color: #0d57b5;
      background: #eaf3ff;
    }

    .icon-button {
      width: 38px;
      min-width: 38px;
      padding: 0;
      font-size: 16px;
    }

    .select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
      font: 600 13px/1 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }

    .hud {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 3;
      width: min(320px, calc(100vw - 36px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.14);
      backdrop-filter: blur(12px);
    }

    .hud h1 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .metric {
      min-height: 48px;
      padding: 8px;
      border: 1px solid rgba(23, 32, 51, 0.08);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.72);
    }

    .metric b {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }

    .metric span {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      font-weight: 700;
    }

    .tag {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .hud {
        display: none;
      }

      .topbar {
        top: 10px;
      }

      .toolbar {
        bottom: 10px;
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <section class="hud" aria-label="system status">
    <h1>全屋暖通与水路系统</h1>
    <div class="tag">spatial-meta/v1 · Three.js adapter</div>
    <div class="metrics">
      <div class="metric"><b>VRF 室内机</b><span id="vrfCount">0</span></div>
      <div class="metric"><b>新风风口</b><span id="ventCount">0</span></div>
      <div class="metric"><b>地暖回路</b><span id="loopCount">0</span></div>
      <div class="metric"><b>水路管线</b><span id="pipeCount">0</span></div>
    </div>
  </section>

  <nav class="topbar" aria-label="view controls">
    <button class="icon-button" id="resetView" title="重置视角">⌂</button>
    <select class="select" id="preset">
      <option value="full">全部系统</option>
      <option value="arch">仅建筑</option>
      <option value="furniture">仅家具</option>
      <option value="hvac">中央空调</option>
      <option value="freshAir">新风</option>
      <option value="heating">地暖</option>
      <option value="water">生活用水</option>
    </select>
    <button class="icon-button" id="toggleLabels" title="标签">▣</button>
    <button class="icon-button" id="toggleFlow" title="气流">≈</button>
  </nav>

  <nav class="toolbar" aria-label="system modules">
    <button data-layer="arch" class="active">建筑结构</button>
    <button data-layer="furniture" class="active">家具陈设</button>
    <button data-layer="hvac" class="active">中央空调</button>
    <button data-layer="freshAir" class="active">新风模块</button>
    <button data-layer="heating" class="active">地暖模块</button>
    <button data-layer="water" class="active">生活用水</button>
  </nav>

  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "./node_modules/three/examples/jsm/controls/OrbitControls.js";
    import { RGBELoader } from "./node_modules/three/examples/jsm/loaders/RGBELoader.js";

    const spatialMeta = {
      schema: "spatial-meta/v1",
      units: "m",
      coordinateSystem: "Y_UP",
      rooms: [
        { id: "living", name: "客餐厅", origin: [-4.2, 0, -1.8], size: [4.9, 3.7], color: 0xf4f1e8, heating: true },
        { id: "bedroom", name: "卧室", origin: [1.0, 0, -1.8], size: [3.7, 3.4], color: 0xeaf2f7, heating: true },
        { id: "entry", name: "玄关", origin: [-4.2, 0, 2.1], size: [1.55, 1.45], color: 0xeeeeea, heating: false },
        { id: "kitchen", name: "厨房", origin: [-2.45, 0, 2.1], size: [2.2, 1.95], color: 0xf2eef8, heating: false },
        { id: "bath", name: "卫生间", origin: [0.0, 0, 2.05], size: [1.65, 2.0], color: 0xe8f1f6, heating: false },
        { id: "balcony", name: "设备阳台", origin: [2.0, 0, 2.1], size: [2.7, 1.95], color: 0xeaf5ed, heating: false }
      ],
      systems: [
        {
          id: "vrf",
          layer: "hvac",
          type: "vrf_slim_duct",
          units: [
            { id: "indoor_0121", model: "MMD-UP0121SPHY-E", room: "living", pos: [-3.0, 2.42, 1.55], size: [0.7, 0.21, 0.45], coolingKw: 3.6, heatingKw: 4.0 },
            { id: "indoor_0271", model: "MMD-UP0271SPHY-E", room: "bedroom", pos: [3.2, 2.42, 1.42], size: [1.1, 0.21, 0.45], coolingKw: 8.0, heatingKw: 9.0 }
          ],
          ducts: [
            { id: "duct_ac_living_supply", from: [-3.0, 2.42, 1.32], to: [-3.0, 2.42, -0.95], radius: 0.075, flow: "supply" },
            { id: "duct_ac_living_branch", from: [-3.0, 2.42, -0.95], to: [-1.05, 2.42, -0.95], radius: 0.065, flow: "supply" },
            { id: "duct_ac_living_return", from: [-2.6, 2.35, 1.75], to: [-1.1, 2.35, 1.75], radius: 0.06, flow: "return" },
            { id: "duct_ac_bed_supply", from: [3.2, 2.42, 1.16], to: [3.2, 2.42, -1.0], radius: 0.075, flow: "supply" },
            { id: "duct_ac_bed_branch", from: [3.2, 2.42, -1.0], to: [1.55, 2.42, -1.0], radius: 0.06, flow: "supply" },
            { id: "duct_ac_bed_return", from: [2.6, 2.35, 1.62], to: [1.35, 2.35, 1.62], radius: 0.055, flow: "return" }
          ]
        },
        {
          id: "fresh_air",
          layer: "freshAir",
          type: "fresh_air_system",
          unit: { id: "fresh_air_unit", pos: [3.75, 2.16, 3.48], size: [0.72, 0.46, 0.38] },
          ducts: [
            { id: "fresh_outdoor_intake", from: [4.12, 2.16, 3.48], to: [4.78, 2.16, 3.48], radius: 0.065, flow: "fresh" },
            { id: "fresh_main", from: [3.38, 2.16, 3.48], to: [0.58, 2.16, 3.48], radius: 0.065, flow: "fresh" },
            { id: "fresh_corridor", from: [0.58, 2.16, 3.48], to: [0.58, 2.16, 0.2], radius: 0.055, flow: "fresh" },
            { id: "fresh_living", from: [0.58, 2.16, 0.2], to: [-2.7, 2.16, 0.2], radius: 0.05, flow: "fresh" },
            { id: "fresh_bed", from: [0.58, 2.16, 0.2], to: [2.8, 2.16, -0.3], radius: 0.05, flow: "fresh" },
            { id: "exhaust_bath", from: [0.85, 2.08, 3.25], to: [4.78, 2.08, 3.25], radius: 0.05, flow: "exhaust" },
            { id: "exhaust_kitchen", from: [-1.55, 2.08, 3.35], to: [-4.78, 2.08, 3.35], radius: 0.05, flow: "exhaust" }
          ],
          vents: [
            { id: "vent_living", pos: [-2.7, 2.0, 0.2], dir: [0, -1, 0], flow: "fresh" },
            { id: "vent_bed", pos: [2.8, 2.0, -0.3], dir: [0, -1, 0], flow: "fresh" },
            { id: "vent_bath", pos: [0.85, 2.0, 3.25], dir: [0, -1, 0], flow: "exhaust" },
            { id: "vent_kitchen", pos: [-1.55, 2.0, 3.35], dir: [0, -1, 0], flow: "exhaust" }
          ]
        },
        {
          id: "floor_heating",
          layer: "heating",
          type: "hydronic_floor_heating",
          loops: [
            { id: "heat_living_a", room: "living", color: 0xd64a8d, origin: [-4.0, 0.035, -1.55], size: [2.3, 3.05], spacing: 0.26 },
            { id: "heat_living_b", room: "living", color: 0x9a63d9, origin: [-1.62, 0.035, -1.55], size: [2.15, 3.05], spacing: 0.26 },
            { id: "heat_bed", room: "bedroom", color: 0x315fd8, origin: [1.25, 0.035, -1.55], size: [3.25, 2.95], spacing: 0.25 }
          ],
          manifold: { id: "manifold_001", pos: [-0.52, 0.38, 2.55], size: [0.62, 0.22, 0.18] }
        },
        {
          id: "domestic_water",
          layer: "water",
          type: "domestic_hot_cold_water",
          pipes: [
            { id: "cold_riser", from: [1.47, 0.18, 3.75], to: [1.47, 1.45, 3.75], radius: 0.025, color: 0x1678d2 },
            { id: "hot_riser", from: [1.28, 0.25, 3.75], to: [1.28, 1.25, 3.75], radius: 0.025, color: 0xd94b42 },
            { id: "cold_to_bath", from: [1.47, 0.18, 3.35], to: [0.55, 0.18, 3.35], radius: 0.02, color: 0x1678d2 },
            { id: "hot_to_bath", from: [1.28, 0.25, 3.1], to: [0.45, 0.25, 3.1], radius: 0.02, color: 0xd94b42 },
            { id: "cold_to_kitchen", from: [0.55, 0.18, 3.35], to: [-1.9, 0.18, 3.35], radius: 0.02, color: 0x1678d2 },
            { id: "hot_to_kitchen", from: [0.45, 0.25, 3.1], to: [-1.9, 0.25, 3.1], radius: 0.02, color: 0xd94b42 },
            { id: "cold_to_balcony", from: [1.47, 0.18, 3.75], to: [3.35, 0.18, 3.75], radius: 0.018, color: 0x1678d2 },
            { id: "drain_branch", from: [0.9, 0.1, 3.8], to: [-2.0, 0.1, 3.8], radius: 0.03, color: 0x777b83 }
          ]
        }
      ]
    };

    const app = document.querySelector("#app");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8ecf0);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(5.6, 5.1, 7.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.9, 0.9);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.52;

    // Lighting: warm interior photography style (对标酷家乐渲染光)
    // Hemisphere: warm ceiling bounce + cool floor bounce
    scene.add(new THREE.HemisphereLight(0xfff8f0, 0xb0b8c4, 1.5));
    // Key light: warm afternoon sun
    const sun = new THREE.DirectionalLight(0xfff4e8, 3.0);
    sun.position.set(4, 8, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 20;
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);
    // Fill light (opposite side, softer)
    const fill = new THREE.DirectionalLight(0xe8f0ff, 0.6);
    fill.position.set(-5, 4, -3);
    scene.add(fill);

    // Environment map: real HDR for accurate reflections (makes glass/metal look alive)
    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileEquirectangularShader();
    new RGBELoader().load("hotel_room_1k.hdr", (hdrTex) => {
      const envMap = pmremGen.fromEquirectangular(hdrTex).texture;
      scene.environment = envMap;
      hdrTex.dispose();
      pmremGen.dispose();
    });

    const root = new THREE.Group();
    const labelRoot = new THREE.Group();
    const flowRoot = new THREE.Group();
    const layers = new Map();
    const flowParticles = [];
    scene.add(root, labelRoot, flowRoot);

    // === PBR Material System (酷家乐标准) ===
    const texLoader = new THREE.TextureLoader();
    const TEX_BASE = "assets/textures";

    // Load a texture set with real-world scale (1 texture unit = texScale meters)
    function loadTex(name, file, repeat = [1, 1], srgb = false) {
      const tex = texLoader.load(`${TEX_BASE}/${name}/${file}`);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeat[0], repeat[1]);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Create a floor material with repeat scaled to real room size
    // texScale = how many meters one texture tile covers
    function makeFloorMat(texName, roomW, roomD, texScale, opts) {
      const repX = roomW / texScale;
      const repZ = roomD / texScale;
      return new THREE.MeshPhysicalMaterial({
        map: loadTex(texName, `${texName}_diff_1k.jpg`, [repX, repZ], true),
        normalMap: loadTex(texName, `${texName}_nor_gl_1k.jpg`, [repX, repZ]),
        roughnessMap: loadTex(texName, `${texName}_rough_1k.jpg`, [repX, repZ]),
        color: 0xffffff,
        ...opts
      });
    }

    const mats = {
      floorLine: new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }),
      // Walls: smooth white latex paint (乳胶漆) — very subtle texture, mostly flat white
      wall: new THREE.MeshPhysicalMaterial({
        map: loadTex("white_plaster_02", "white_plaster_02_diff_1k.jpg", [3, 3], true),
        normalMap: loadTex("white_plaster_02", "white_plaster_02_nor_gl_1k.jpg", [3, 3]),
        roughnessMap: loadTex("white_plaster_02", "white_plaster_02_rough_1k.jpg", [3, 3]),
        color: 0xfcfcfa, roughness: 0.9, metalness: 0,
        normalScale: new THREE.Vector2(0.15, 0.15),
        transparent: true, opacity: 0.82,
        envMapIntensity: 0.35
      }),
      // Glass: physically correct transmission (酷家乐玻璃标准)
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xeef6f8, roughness: 0.05, metalness: 0,
        transmission: 1.0, thickness: 0.06, ior: 1.52,
        attenuationColor: 0xe8f2f5, attenuationDistance: 8,
        specularIntensity: 1.0, envMapIntensity: 1.5,
        side: THREE.DoubleSide
      }),
      black: new THREE.MeshPhysicalMaterial({ color: 0x0a0a0c, roughness: 0.3, metalness: 0.15, envMapIntensity: 0.8 }),
      // HVAC: galvanised metal with realistic finish
      ductBlue: new THREE.MeshPhysicalMaterial({ color: 0x73bdea, roughness: 0.28, metalness: 0.7, envMapIntensity: 1.0 }),
      ductFresh: new THREE.MeshPhysicalMaterial({ color: 0x95d8ef, roughness: 0.25, metalness: 0.65, envMapIntensity: 0.95 }),
      exhaust: new THREE.MeshPhysicalMaterial({ color: 0xea6a5e, roughness: 0.3, metalness: 0.6, envMapIntensity: 0.9 }),
      equipment: new THREE.MeshPhysicalMaterial({ color: 0x2e333a, roughness: 0.4, metalness: 0.85, envMapIntensity: 1.1 }),
      equipmentLight: new THREE.MeshPhysicalMaterial({ color: 0xc7d2d8, roughness: 0.35, metalness: 0.6, envMapIntensity: 0.9 }),
      manifold: new THREE.MeshPhysicalMaterial({ color: 0xd0d8e2, roughness: 0.38, metalness: 0.75, envMapIntensity: 1.0 }),
      // Furniture — 酷家乐级别参数
      // 布艺沙发: sheen模拟织物光泽
      sofa: new THREE.MeshPhysicalMaterial({ color: 0xB8B4AE, roughness: 0.78, sheen: 0.4, sheenColor: 0x9A9690, sheenRoughness: 0.7, envMapIntensity: 0.2 }),
      sofaCushion: new THREE.MeshPhysicalMaterial({ color: 0xCCC8C2, roughness: 0.85, sheen: 0.5, sheenColor: 0xB0ACA6, sheenRoughness: 0.65, envMapIntensity: 0.2 }),
      // 岩板茶几/餐桌: 极低roughness + 强clearcoat = 大理石/岩板质感

      metalLeg: new THREE.MeshPhysicalMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.95, envMapIntensity: 1.4 }),
      // 电视柜: 深色实木（深胡桃木）
      tvCabinet: new THREE.MeshPhysicalMaterial({
        map: loadTex("dark_wood", "dark_wood_diff_1k.jpg", [2, 1], true),
        normalMap: loadTex("dark_wood", "dark_wood_nor_gl_1k.jpg", [2, 1]),
        roughnessMap: loadTex("dark_wood", "dark_wood_rough_1k.jpg", [2, 1]),
        color: 0xffffff, roughness: 0.45, metalness: 0.05,
        normalScale: new THREE.Vector2(0.4, 0.4),
        clearcoat: 0.12, clearcoatRoughness: 0.4,
        envMapIntensity: 0.6
      }),
      // 岩板餐桌面
      diningTable: new THREE.MeshPhysicalMaterial({ color: 0xF0EDE8, roughness: 0.08, metalness: 0.02, clearcoat: 0.85, clearcoatRoughness: 0.03, envMapIntensity: 1.1 }),
      // 餐椅: 皮革/布面
      diningChair: new THREE.MeshPhysicalMaterial({ color: 0xC8BDA5, roughness: 0.68, sheen: 0.25, sheenColor: 0xA89880, sheenRoughness: 0.6, envMapIntensity: 0.3 }),
      // 床架: 布艺软包
      bedFrame: new THREE.MeshPhysicalMaterial({ color: 0xE8E5E0, roughness: 0.75, sheen: 0.35, sheenColor: 0xD4D0CA, sheenRoughness: 0.6, envMapIntensity: 0.2 }),
      mattress: new THREE.MeshPhysicalMaterial({ color: 0xFAF9F7, roughness: 0.92, envMapIntensity: 0.1 }),
      // 衣柜: 白色高光烤漆面板
      wardrobe: new THREE.MeshPhysicalMaterial({
        color: 0xFAFAFA, roughness: 0.15, metalness: 0,
        clearcoat: 0.5, clearcoatRoughness: 0.08,
        envMapIntensity: 0.7
      }),
      // 鞋柜: 白色亚光漆
      shoeCabinet: new THREE.MeshPhysicalMaterial({ color: 0xF5F5F5, roughness: 0.3, clearcoat: 0.25, clearcoatRoughness: 0.15, envMapIntensity: 0.5 }),
      // 厨柜: 浅色木纹饰面
      kitchenCabinet: new THREE.MeshPhysicalMaterial({
        map: loadTex("plywood", "plywood_diff_1k.jpg", [2, 1], true),
        normalMap: loadTex("plywood", "plywood_nor_gl_1k.jpg", [2, 1]),
        roughnessMap: loadTex("plywood", "plywood_rough_1k.jpg", [2, 1]),
        color: 0xffffff, roughness: 0.4, metalness: 0,
        normalScale: new THREE.Vector2(0.3, 0.3),
        envMapIntensity: 0.45
      }),
      // 台面: 石英石

      baseboard: new THREE.MeshPhysicalMaterial({ color: 0xF0F0F0, roughness: 0.4, metalness: 0, envMapIntensity: 0.3 }),

    function layerGroup(name) {
      if (!layers.has(name)) {
        const group = new THREE.Group();
        group.name = name;
        layers.set(name, group);
        root.add(group);
      }
      return layers.get(name);
    }

    function makeBox(size, pos, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.position.set(pos[0], pos[1], pos[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeCylinderBetween(from, to, radius, material, radialSegments = 16) {
      const start = new THREE.Vector3(...from);
      const end = new THREE.Vector3(...to);
      const mid = start.clone().add(end).multiplyScalar(0.5);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, radialSegments), material);
      mesh.position.copy(mid);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      return mesh;
    }

    function makeRectPath(origin, size, y, inset = 0) {
      const [x, , z] = origin;
      const [w, h] = size;
      const a = x + inset;
      const b = x + w - inset;
      const c = z + inset;
      const d = z + h - inset;
      return [
        new THREE.Vector3(a, y, c),
        new THREE.Vector3(b, y, c),
        new THREE.Vector3(b, y, d),
        new THREE.Vector3(a, y, d),
        new THREE.Vector3(a, y, c)
      ];
    }

    function buildRoomShell() {
      const shell = new THREE.Group();
      // Concrete slab
      const slabShape = new THREE.Shape();
      slabShape.moveTo(-4.8, -2.7);
      slabShape.lineTo(4.8, -2.7);
      slabShape.lineTo(4.8, 4.3);
      slabShape.lineTo(-4.8, 4.3);
      slabShape.lineTo(-4.8, -2.7);
      const slab = new THREE.Mesh(
        new THREE.ExtrudeGeometry(slabShape, { depth: 0.12, bevelEnabled: false }),
        new THREE.MeshStandardMaterial({ color: 0xeae8e4, roughness: 0.8 })
      );
      slab.rotation.x = Math.PI / 2;
      slab.position.y = -0.12;
      slab.receiveShadow = true;
      shell.add(slab);

      // Room floors with PBR materials — each room gets its own material with correct UV scale
      const woodRooms = new Set(["living", "bedroom"]);
      spatialMeta.rooms.forEach((room) => {
        const [rw, rd] = room.size;
        // Wood floor: 1 texture tile = 1.2m (typical plank board width pattern)
        // Tile floor: 1 texture tile = 0.6m (standard 600x600 tile)
        const floorMat = woodRooms.has(room.id)
          ? makeFloorMat("wood_floor", rw, rd, 1.2, {
              roughness: 0.48, metalness: 0.04,
              clearcoat: 0.28, clearcoatRoughness: 0.4,
              envMapIntensity: 0.9
            })
          : makeFloorMat("tiled_floor_001", rw, rd, 0.6, {
              roughness: 0.1, metalness: 0.02,
              clearcoat: 0.9, clearcoatRoughness: 0.05,
              envMapIntensity: 1.0
            });
        const floor = makeBox(
          [rw, 0.025, rd],
          [room.origin[0] + rw / 2, 0.005, room.origin[2] + rd / 2],
          floorMat
        );
        floor.receiveShadow = true;
        shell.add(floor);

        // Room boundary line
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(makeRectPath(room.origin, room.size, 0.035)),
          mats.floorLine
        );
        shell.add(line);
      });

      // ── Walls ──────────────────────────────────────────────────────────────
      // Each wall segment is placed so openings (windows / doors) are simply
      // gaps — we split continuous walls into pieces that surround each opening.
      const WH = 2.8;   // wall height
      const WT = 0.12;  // exterior wall thickness
      const IWT = 0.1;  // interior wall thickness

      const wallMat = mats.wall;

      // Helper: add a wall segment
      const addWall = (sx, sy, sz, px, py, pz) =>
        shell.add(makeBox([sx, sy, sz], [px, py, pz], wallMat));

      // ── South exterior wall Z=-2.7  (no openings — solid) ──────────────────
      addWall(9.8, WH, WT, 0, WH / 2, -2.7);

      // ── North exterior wall Z=+4.3  ────────────────────────────────────────
      // Window W3: 阳台飘窗 on bedroom/balcony side
      //   Opening: X +1.85 ~ +4.55, height 0.9~2.4 (sill 0.9m, top 2.4m)
      // Segments: left piece, right piece, sill, header
      addWall(6.35, WH, WT, -1.575, WH / 2, 4.3);        // left of opening
      // right stub is flush with east wall — skip (east wall covers it)
      // sill below window
      addWall(2.7, 0.9, WT,  3.2,  0.45, 4.3);
      // header above window
      addWall(2.7, 0.4, WT,  3.2,  2.6,  4.3);

      // ── West exterior wall X=-4.8  ─────────────────────────────────────────
      // Window W1: 客厅落地窗
      //   Opening: Z -1.55 ~ +0.95, sill 0.3m, top 2.5m (almost floor-to-ceiling)
      // Segments: south stub, north stub, sill, header
      addWall(WT, WH, 1.15, -4.8, WH / 2, -2.125);       // south of opening Z -2.7~-1.55
      addWall(WT, WH, 3.35, -4.8, WH / 2,  2.575);       // north of opening Z +0.95~+4.3
      addWall(WT, 0.3, 2.5,  -4.8, 0.15,  -0.3);         // sill
      addWall(WT, 0.3, 2.5,  -4.8, 2.65,  -0.3);         // header

      // ── East exterior wall X=+4.8  ─────────────────────────────────────────
      // Balcony louver zone covers Z +2.1~+4.05 — treat as opaque panel
      // Window W2: 卫生间小窗 Z +2.4~+3.6, sill 1.0m, top 2.2m
      addWall(WT, WH, 4.8, 4.8, WH / 2, -0.6);           // south section Z -2.7~+2.1
      addWall(WT, 1.0, 1.2, 4.8, 0.5,    3.0);            // sill of bathroom window
      addWall(WT, 0.6, 1.2, 4.8, 2.5,    3.0);            // header
      addWall(WT, WH, 0.7, 4.8, WH / 2,  3.95);           // north of window Z+3.6~+4.3

      // ── Interior walls ─────────────────────────────────────────────────────
      // IW-A: 客厅/卧室 divider  X=+0.8, runs Z -2.7~+1.0
      //   Door opening at Z +0.1~+0.9 (door to bedroom corridor), h 2.1m
      addWall(IWT, WH, 2.5,  0.8, WH / 2, -1.45);        // south of door Z-2.7~-0.2
      addWall(IWT, 0.7, 0.8, 0.8, 2.45,    0.5);          // header above door
      addWall(IWT, WH, 0.4,  0.8, WH / 2,  0.85);        // north stub Z+0.65~+1.05 (thin)

      // IW-B: 玄关/厨房 divider  X=-2.55, runs Z +2.1~+4.3
      //   Door opening to 玄关 at Z +2.1~+2.9 (h 2.1)
      addWall(IWT, WH, 1.4,  -2.55, WH / 2, 3.6);        // north part Z+2.9~+4.3

      // IW-C: 厨房/卫生间 divider  X=-0.05, runs Z +2.1~+4.3
      //   Door opening to 厨房/卫生间 at Z +2.1~+2.85
      addWall(IWT, WH, 1.45, -0.05, WH / 2, 3.575);      // north part

      // IW-D: 卫生间/阳台 divider  X=+1.82, runs Z +2.1~+4.3
      //   Door opening at Z +2.1~+2.85 (to 卫生间)
      addWall(IWT, WH, 1.45,  1.82, WH / 2, 3.575);      // north part

      // IW-E: 横向分隔 (客厅 south side of wet zone)  Z=+1.98
      //   Opening for corridor at X -0.55~+0.55 (pass-through)
      addWall(3.2, WH, IWT, -3.35, WH / 2, 1.98);        // west segment X -4.8~-1.75
      addWall(1.5, WH, IWT,  0.45, WH / 2, 1.98);        // east segment X -0.3~+1.2

      // IW-F: 卧室/阳台 divider  Z=+1.9, east side
      addWall(2.7, WH, IWT,  3.35, WH / 2, 1.9);

      // ── Windows ────────────────────────────────────────────────────────────
      // W1: 客厅落地窗 on west wall — near floor-to-ceiling, 2.5m wide × 2.2m tall
      shell.add(makeBox([WT, 2.2, 2.5], [-4.8, 1.4, -0.3], mats.glass));

      // W2: 卫生间小窗 on east wall — 1.2m wide × 1.2m tall, sill 1.0m
      shell.add(makeBox([WT, 1.2, 1.2], [4.8, 1.6, 3.0], mats.glass));

      // W3: 阳台飘窗 on north wall — 2.7m wide × 1.5m tall, sill 0.9m
      shell.add(makeBox([2.7, 1.5, WT], [3.2, 1.65, 4.3], mats.glass));

      // ── Doors ──────────────────────────────────────────────────────────────
      const doorMat = new THREE.MeshPhysicalMaterial({
        color: 0xF0EDE8, roughness: 0.35, metalness: 0,
        clearcoat: 0.25, clearcoatRoughness: 0.3, envMapIntensity: 0.5
      });
      const doorFrameMat = new THREE.MeshPhysicalMaterial({
        color: 0xFFFFFF, roughness: 0.4, metalness: 0, envMapIntensity: 0.3
      });

      // Helper: build a door (panel + frame) at given position, facing axis
      // axis: 'x' = door in YZ plane (set into X-axis wall), 'z' = XY plane
      function makeDoor(cx, cz, w, h, axis, open = false) {
        const g = new THREE.Group();
        const thick = 0.04;
        const frameW = 0.06;

        // Frame sides and top
        if (axis === 'x') {
          // Frame
          g.add(makeBox([thick, h + frameW, frameW], [cx, h / 2, cz - w / 2], doorFrameMat));
          g.add(makeBox([thick, h + frameW, frameW], [cx, h / 2, cz + w / 2], doorFrameMat));
          g.add(makeBox([thick, frameW, w + frameW * 2], [cx, h + frameW / 2, cz], doorFrameMat));
          // Door panel
          if (!open) {
            g.add(makeBox([thick, h - 0.02, w - 0.06], [cx, h / 2, cz], doorMat));
          } else {
            // Swung open 90° — panel lies along Z axis
            g.add(makeBox([thick, h - 0.02, w - 0.06], [cx, h / 2, cz - w / 2 + 0.02], doorMat));
          }
        } else {
          // Frame
          g.add(makeBox([frameW, h + frameW, thick], [cx - w / 2, h / 2, cz], doorFrameMat));
          g.add(makeBox([frameW, h + frameW, thick], [cx + w / 2, h / 2, cz], doorFrameMat));
          g.add(makeBox([w + frameW * 2, frameW, thick], [cx, h + frameW / 2, cz], doorFrameMat));
          if (!open) {
            g.add(makeBox([w - 0.06, h - 0.02, thick], [cx, h / 2, cz], doorMat));
          } else {
            g.add(makeBox([w - 0.06, h - 0.02, thick], [cx + w / 2 - 0.02, h / 2, cz], doorMat));
          }
        }
        shell.add(g);
      }

      // 1. 卧室门 — IW-A at X=+0.8, opening Z +0.1~+0.9
      makeDoor(0.8, 0.5, 0.8, 2.1, 'x', true);

      // 2. 玄关→走道 — IW-B at X=-2.55, opening Z +2.1~+2.9
      makeDoor(-2.55, 2.5, 0.8, 2.1, 'x');

      // 3. 厨房门 — IW-C at X=-0.05, opening Z +2.1~+2.85
      makeDoor(-0.05, 2.475, 0.75, 2.1, 'x');

      // 4. 卫生间门 — IW-D at X=+1.82, opening Z +2.1~+2.85
      makeDoor(1.82, 2.475, 0.75, 2.1, 'x');

      // Balcony louver
      const louver = new THREE.Group();
      louver.add(makeBox([0.14, 2.6, 0.1], [0, 1.3, 0], mats.black));
      for (let i = 0; i < 16; i += 1) {
        louver.add(makeBox([1.24, 0.045, 0.08], [0, 0.18 + i * 0.15, 0.02], mats.black));
      }
      louver.position.set(4.72, 0, 2.9);
      shell.add(louver);

      // Soffits / dropped ceiling panels
      const soffitMat = new THREE.MeshPhysicalMaterial({ color: 0xe7e9ec, roughness: 0.6, metalness: 0, transparent: true, opacity: 0.88 });
      [
        { size: [5.2, 0.08, 0.5], pos: [-2.25, 2.55, 1.72] },
        { size: [3.9, 0.08, 0.5], pos: [2.8, 2.55, 1.65] },
        { size: [4.4, 0.08, 0.45], pos: [2.55, 2.5, 3.65] }
      ].forEach((s) => shell.add(makeBox(s.size, s.pos, soffitMat)));

      // Ceiling LED strip (recessed light cove)
      const ledStripMat = new THREE.MeshBasicMaterial({ color: 0xFFF5E0, transparent: true, opacity: 0.6 });
      [
        { size: [4.8, 0.02, 0.04], pos: [-2.25, 2.52, 1.47] },
        { size: [3.5, 0.02, 0.04], pos: [2.8, 2.52, 1.4] }
      ].forEach((strip) => shell.add(makeBox(strip.size, strip.pos, ledStripMat)));

      // Baseboards (踢脚线) along main walls
      const baseboardH = 0.08, baseboardD = 0.015;
      [
        { size: [9.6, baseboardH, baseboardD], pos: [0, baseboardH / 2, -2.64] },
        { size: [9.6, baseboardH, baseboardD], pos: [0, baseboardH / 2, 4.24] },
        { size: [baseboardD, baseboardH, 6.8], pos: [-4.74, baseboardH / 2, 0.8] },
        { size: [baseboardD, baseboardH, 6.8], pos: [4.74, baseboardH / 2, 0.8] }
      ].forEach((bb) => shell.add(makeBox(bb.size, bb.pos, mats.baseboard)));

      // Wet area fixtures (kitchen sink, toilet, washing machine etc.)
      const wetFixtureData = [
        { size: [1.55, 0.55, 0.45], pos: [-1.55, 0.28, 3.68], mat: mats.kitchenCabinet },
        { size: [1.55, 0.02, 0.45], pos: [-1.55, 0.56, 3.68], mat: mats.countertop },
        { size: [0.55, 0.18, 0.42], pos: [-1.95, 0.66, 3.68], mat: mats.sanitary },
        { size: [0.55, 0.42, 0.75], pos: [0.38, 0.25, 3.55], mat: mats.sanitary },
        { size: [0.72, 0.16, 0.46], pos: [1.08, 0.62, 3.18], mat: mats.sanitary },
        { size: [0.5, 1.05, 0.42], pos: [3.75, 0.55, 3.58], mat: mats.equipment }
      ];
      wetFixtureData.forEach((item) => shell.add(makeBox(item.size, item.pos, item.mat)));

      layerGroup("arch").add(shell);
    }

        new THREE.MeshPhysicalMaterial({color:0x0a0f14,roughness:0.05,metalness:0.1,envMapIntensity:0.5})));
      furn.add(tvGroup);

      // ── 餐桌椅: 岩板面 + 黑铁腿 + 皮革椅 ──────────────────────────────────
      const diningGroup = new THREE.Group();
      diningGroup.add(makeBox([1.3, 0.032, 0.75], [-1.0, 0.722, 0.2], mats.slabTop));  // 桌面岩板
      diningGroup.add(makeBox([1.28,0.008,0.73], [-1.0, 0.688, 0.2], mats.metalLeg));  // 底框
      // 一字型金属桌脚 (两端各一对)
      [[-1.5],[-0.5]].forEach(([x]) => {
        diningGroup.add(makeBox([0.05,0.68,0.05],[x, 0.34, -0.05], mats.metalLeg));
        diningGroup.add(makeBox([0.05,0.68,0.05],[x, 0.34,  0.45], mats.metalLeg));
        diningGroup.add(makeBox([0.05,0.04,0.55],[x, 0.04,  0.2],  mats.metalLeg)); // 底横撑
      });

      // 4把餐椅 — 座面(皮革) + 靠背(藤编色) + 金属腿独立材质
      const chairOffsets = [[-1.38,-0.28],[-0.62,-0.28],[-1.38,0.68],[-0.62,0.68]];
      chairOffsets.forEach(([cx, cz]) => {
        const facingNorth = cz > 0.3;
        diningGroup.add(makeBox([0.42,0.032,0.42],[cx, 0.45, cz], mats.chairSeat));      // 座面
        // 靠背: 2根横梁 + 1根竖梁
        const bz = cz + (facingNorth ? 0.22 : -0.22);
        diningGroup.add(makeBox([0.38,0.028,0.04],[cx, 0.68, bz], mats.chairBack));
        diningGroup.add(makeBox([0.38,0.028,0.04],[cx, 0.85, bz], mats.chairBack));
        diningGroup.add(makeBox([0.025,0.45,0.025],[cx, 0.68, bz], mats.metalLeg));      // 靠背竖梁
        // 4条椅腿
        [[-0.17,-0.17],[ 0.17,-0.17],[-0.17, 0.17],[ 0.17, 0.17]].forEach(([dx,dz]) =>
          diningGroup.add(makeBox([0.025,0.44,0.025],[cx+dx, 0.22, cz+dz], mats.metalLeg)));
      });
      furn.add(diningGroup);

      // ── 卧室: 橡木色床 ──────────────────────────────────────────────────────
      const bedGroup = new THREE.Group();
      bedGroup.add(makeBox([1.92,0.28,2.12],[2.85, 0.14, -0.75], mats.bedOak));        // 床框
      bedGroup.add(makeBox([1.82,0.22,2.02],[2.85, 0.39, -0.75], mats.mattress));      // 床垫
      // 靠背: 软包 + 外框
      bedGroup.add(makeBox([1.92,0.68,0.10],[2.85, 0.82, -1.73], mats.bedFrame));      // 软包
      bedGroup.add(makeBox([1.92,0.68,0.10],[2.85, 0.82, -1.73],                       // 外框线条
        new THREE.MeshPhysicalMaterial({color:0xD8D0C8,roughness:0.5,wireframe:false,envMapIntensity:0.3})));
      // 床品: 被子 + 枕头
      bedGroup.add(makeBox([1.78,0.08,1.38],[2.85, 0.53, -0.38], mats.bedding));       // 被子
      bedGroup.add(makeBox([1.78,0.04,1.38],[2.85, 0.62, -0.38],                       // 被子折边
        new THREE.MeshPhysicalMaterial({color:0xE8E2D8,roughness:0.9,sheen:0.3,sheenColor:0xCCC8BC,sheenRoughness:0.8})));
      bedGroup.add(makeBox([0.56,0.14,0.36],[2.42, 0.56, -1.45], mats.bedding));       // 枕头L
      bedGroup.add(makeBox([0.56,0.14,0.36],[3.28, 0.56, -1.45], mats.bedding));       // 枕头R
      furn.add(bedGroup);

      // ── 床头柜 x2: 亚白色 + 金属腿 + 细拉手 ────────────────────────────────
      [[1.72],[3.98]].forEach(([x]) => {
        furn.add(makeBox([0.42,0.38,0.38],[x, 0.22, -1.45], mats.nightstand));         // 柜体
        furn.add(makeBox([0.42,0.005,0.38],[x,0.42,-1.45], mats.slabTop));             // 台面
        furn.add(makeBox([0.14,0.01,0.01],[x, 0.22, -1.27], mats.steelHandle));        // 拉手
        [[-0.17,0.17],[ 0.17,0.17],[-0.17,-0.17],[ 0.17,-0.17]].forEach(([dx,dz]) =>
          furn.add(makeBox([0.025,0.06,0.025],[x+dx,0.03,-1.45+dz], mats.metalLeg)));
      });

      // ── 衣柜: 白色烤漆 + 金属拉手 + 分缝 ───────────────────────────────────
      furn.add(makeBox([1.6,2.2,0.58],[2.85,1.1,1.55], mats.wardrobe));
      // 竖向分缝线 (3扇门)
      [-0.53,0.53].forEach((dx) =>
        furn.add(makeBox([0.006,2.2,0.005],[2.85+dx,1.1,1.27], mats.steelHandle)));
      // 拉手
      [2.32,2.85,3.38].forEach((x) =>
        furn.add(makeBox([0.012,0.14,0.012],[x,1.1,1.27], mats.steelHandle)));

      // ── 玄关鞋柜 + 穿衣镜 ───────────────────────────────────────────────────
      furn.add(makeBox([1.3,0.92,0.32],[-3.85,0.46,2.35], mats.shoeCabinet));
      furn.add(makeBox([1.28,0.005,0.3],[-3.85,0.925,2.35], mats.slabTop));            // 台面
      furn.add(makeBox([0.12,0.01,0.01],[-3.85,0.46,2.21], mats.steelHandle));         // 拉手
      furn.add(makeBox([0.55,0.85,0.018],[-3.85,1.6,2.22], mats.mirror));              // 镜子
      // 镜框 (黑色细线)
      furn.add(makeBox([0.57,0.87,0.014],[-3.85,1.6,2.215], mats.black));

      // ── 厨房上下柜 ──────────────────────────────────────────────────────────
      // 吊柜 (上柜)
      furn.add(makeBox([1.9,0.62,0.32],[-1.55,2.02,3.73], mats.kitchenCabinet));
      furn.add(makeBox([0.012,0.62,0.005],[-0.62,2.02,3.57], mats.steelHandle));       // 分缝
      furn.add(makeBox([0.012,0.62,0.005],[-1.58,2.02,3.57], mats.steelHandle));
      // 下柜台面拉手
      furn.add(makeBox([0.5,0.01,0.01],[-1.55,0.58,3.49], mats.steelHandle));

      layerGroup("furniture").add(furn);
    }

    function makeLabel(text, position, color = "#2455df") {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = color;
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 8;
      ctx.roundRect(10, 10, 492, 140, 14);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "white";
      ctx.font = "bold 34px Microsoft YaHei, sans-serif";
      const lines = text.split("\n");
      lines.forEach((line, index) => ctx.fillText(line, 32, 58 + index * 42));
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(1.55, 0.48, 1);
      sprite.position.set(position[0], position[1], position[2]);
      labelRoot.add(sprite);
      return sprite;
    }

    function roundedRectSupport() {
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function roundRect(x, y, w, h, r) {
          this.beginPath();
          this.moveTo(x + r, y);
          this.lineTo(x + w - r, y);
          this.quadraticCurveTo(x + w, y, x + w, y + r);
          this.lineTo(x + w, y + h - r);
          this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          this.lineTo(x + r, y + h);
          this.quadraticCurveTo(x, y + h, x, y + h - r);
          this.lineTo(x, y + r);
          this.quadraticCurveTo(x, y, x + r, y);
          this.closePath();
          return this;
        };
      }
    }

    function buildVrf(system) {
      const group = layerGroup(system.layer);
      system.units.forEach((unit) => {
        const unitGroup = new THREE.Group();
        unitGroup.add(makeBox(unit.size, unit.pos, mats.equipment));
        unitGroup.add(makeBox([unit.size[0] * 0.75, unit.size[1] * 0.62, unit.size[2] * 0.22], [unit.pos[0], unit.pos[1], unit.pos[2] + unit.size[2] * 0.62], mats.equipmentLight));
        group.add(unitGroup);
        makeLabel(`${unit.model}\n${Math.round(unit.size[0] * 1000)}*${Math.round(unit.size[2] * 1000)}*${Math.round(unit.size[1] * 1000)}`, [unit.pos[0], unit.pos[1] + 0.62, unit.pos[2] - 0.22]);
      });

      system.ducts.forEach((duct) => {
        group.add(makeCylinderBetween(duct.from, duct.to, duct.radius, mats.ductBlue, 18));
        addFlow(duct.from, duct.to, duct.flow === "supply" ? 0x2f80ed : 0xe24b4b);
      });

      [
        { pos: [-1.05, 2.18, -0.95], size: [0.62, 0.04, 0.16], type: "supply" },
        { pos: [-1.1, 2.12, 1.75], size: [0.58, 0.04, 0.22], type: "return" },
        { pos: [1.55, 2.18, -1.0], size: [0.62, 0.04, 0.16], type: "supply" },
        { pos: [1.35, 2.12, 1.62], size: [0.58, 0.04, 0.22], type: "return" }
      ].forEach((grille) => {
        const grilleGroup = new THREE.Group();
        grilleGroup.add(makeBox(grille.size, grille.pos, grille.type === "supply" ? mats.ductBlue : mats.equipmentLight));
        for (let i = 0; i < 5; i += 1) {
          grilleGroup.add(makeBox([grille.size[0] * 0.86, 0.012, 0.008], [grille.pos[0], grille.pos[1] + 0.026, grille.pos[2] - 0.055 + i * 0.028], mats.black));
        }
        group.add(grilleGroup);
      });
    }

    function buildFreshAir(system) {
      const group = layerGroup(system.layer);
      group.add(makeBox(system.unit.size, system.unit.pos, mats.equipment));
      makeLabel("新风主机\n送风 / 排风", [system.unit.pos[0], system.unit.pos[1] + 0.55, system.unit.pos[2]], "#168fb2");
      system.ducts.forEach((duct) => {
        group.add(makeCylinderBetween(duct.from, duct.to, duct.radius, duct.flow === "exhaust" ? mats.exhaust : mats.ductFresh, 18));
        addFlow(duct.from, duct.to, duct.flow === "exhaust" ? 0xe24b4b : 0x1cb7d2);
      });
      system.vents.forEach((vent) => {
        const ventMesh = makeBox([0.38, 0.04, 0.24], vent.pos, vent.flow === "exhaust" ? mats.exhaust : mats.ductFresh);
        group.add(ventMesh);
        const end = [
          vent.pos[0] + vent.dir[0] * 0.78,
          vent.pos[1] + vent.dir[1] * 0.78,
          vent.pos[2] + vent.dir[2] * 0.78
        ];
        addFlow(vent.pos, end, vent.flow === "exhaust" ? 0xe24b4b : 0x1cb7d2, 26, 0.035);
      });
    }

    function serpentinePoints(loop) {
      const points = [];
      const x0 = loop.origin[0] + 0.18;
      const z0 = loop.origin[2] + 0.18;
      const width = loop.size[0] - 0.36;
      const height = loop.size[1] - 0.36;
      const rows = Math.max(4, Math.floor(height / loop.spacing));
      for (let i = 0; i <= rows; i += 1) {
        const z = z0 + (height / rows) * i;
        const xStart = i % 2 === 0 ? x0 : x0 + width;
        const xEnd = i % 2 === 0 ? x0 + width : x0;
        points.push(new THREE.Vector3(xStart, loop.origin[1], z));
        points.push(new THREE.Vector3(xEnd, loop.origin[1], z));
      }
      return points;
    }

    function buildFloorHeating(system) {
      const group = layerGroup(system.layer);
      system.loops.forEach((loop) => {
        const curve = new THREE.CatmullRomCurve3(serpentinePoints(loop), false, "catmullrom", 0.02);
        const mesh = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 180, 0.018, 8, false),
          new THREE.MeshStandardMaterial({ color: loop.color, roughness: 0.45 })
        );
        group.add(mesh);
      });
      group.add(makeBox(system.manifold.size, system.manifold.pos, mats.manifold));
      makeLabel("地暖分集水器\n3 个回路", [system.manifold.pos[0], 0.95, system.manifold.pos[2]], "#3d6acb");
    }

    function buildWater(system) {
      const group = layerGroup(system.layer);
      system.pipes.forEach((pipe) => {
        const material = new THREE.MeshStandardMaterial({ color: pipe.color, roughness: 0.35 });
        group.add(makeCylinderBetween(pipe.from, pipe.to, pipe.radius, material, 14));
      });
      group.add(makeBox([0.34, 1.18, 0.42], [1.35, 0.68, 3.78], new THREE.MeshStandardMaterial({ color: 0xd8dde4, roughness: 0.5 })));
      makeLabel("生活冷热水\n管井至厨卫阳台", [0.25, 1.3, 3.55], "#2196c7");
    }

    function addFlow(from, to, color, count = 42, size = 0.045) {
      const start = new THREE.Vector3(...from);
      const end = new THREE.Vector3(...to);
      const segment = { start, end, color, particles: [] };
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.82 });
      for (let i = 0; i < count; i += 1) {
        const particle = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 8), mat);
        particle.userData.t = i / count;
        particle.userData.speed = 0.0018 + Math.random() * 0.0018;
        flowRoot.add(particle);
        segment.particles.push(particle);
      }
      flowParticles.push(segment);
    }

    function animateFlow() {
      flowParticles.forEach((segment) => {
        segment.particles.forEach((particle) => {
          particle.userData.t = (particle.userData.t + particle.userData.speed) % 1;
          particle.position.lerpVectors(segment.start, segment.end, particle.userData.t);
          particle.position.y += Math.sin((particle.userData.t + performance.now() * 0.0008) * Math.PI * 2) * 0.025;
        });
      });
    }

    function buildSceneFromMeta(meta) {
      roundedRectSupport();
      buildRoomShell();
      buildFurniture();
      meta.systems.forEach((system) => {
        if (system.type === "vrf_slim_duct") buildVrf(system);
        if (system.type === "fresh_air_system") buildFreshAir(system);
        if (system.type === "hydronic_floor_heating") buildFloorHeating(system);
        if (system.type === "domestic_hot_cold_water") buildWater(system);
      });

      document.querySelector("#vrfCount").textContent = meta.systems.find((s) => s.id === "vrf").units.length;
      document.querySelector("#ventCount").textContent = meta.systems.find((s) => s.id === "fresh_air").vents.length;
      document.querySelector("#loopCount").textContent = meta.systems.find((s) => s.id === "floor_heating").loops.length;
      document.querySelector("#pipeCount").textContent = meta.systems.find((s) => s.id === "domestic_water").pipes.length;
    }

    function setLayerVisible(layer, visible) {
      const group = layers.get(layer);
      if (group) group.visible = visible;
      document.querySelector(`[data-layer="${layer}"]`)?.classList.toggle("active", visible);
    }

    function applyPreset(value) {
      const all = ["arch", "furniture", "hvac", "freshAir", "heating", "water"];
      all.forEach((layer) => setLayerVisible(layer, value === "full" || layer === value));
    }

    document.querySelectorAll("[data-layer]").forEach((button) => {
      button.addEventListener("click", () => {
        const layer = button.dataset.layer;
        const group = layers.get(layer);
        setLayerVisible(layer, !(group?.visible ?? true));
        document.querySelector("#preset").value = "full";
      });
    });

    document.querySelector("#preset").addEventListener("change", (event) => applyPreset(event.target.value));
    document.querySelector("#toggleLabels").addEventListener("click", () => {
      labelRoot.visible = !labelRoot.visible;
      document.querySelector("#toggleLabels").classList.toggle("active", labelRoot.visible);
    });
    document.querySelector("#toggleFlow").addEventListener("click", () => {
      flowRoot.visible = !flowRoot.visible;
      document.querySelector("#toggleFlow").classList.toggle("active", flowRoot.visible);
    });
    document.querySelector("#resetView").addEventListener("click", () => {
      camera.position.set(5.6, 5.1, 7.0);
      controls.target.set(0, 0.9, 0.9);
      controls.update();
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    buildSceneFromMeta(spatialMeta);

    function animate() {
      controls.update();
      animateFlow();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
