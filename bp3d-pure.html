<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>BP3D · Real Renderer (Pure Test)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1d22; color: #f0f3f5;
      font: 600 12px/1.3 Inter, system-ui, -apple-system, sans-serif; overflow: hidden; }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #status { position: fixed; left: 14px; top: 14px; z-index: 5; padding: 8px 12px;
      border-radius: 6px; background: rgba(20, 24, 30, 0.78); backdrop-filter: blur(10px);
      letter-spacing: 0.04em; font-weight: 700; max-width: calc(100% - 28px); }
    #status.warn { background: rgba(120, 40, 30, 0.85); }
    #title { position: fixed; right: 14px; top: 14px; z-index: 5; padding: 6px 10px;
      border-radius: 6px; background: rgba(20, 24, 30, 0.62); backdrop-filter: blur(8px);
      font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; }
    #controls { position: fixed; right: 14px; bottom: 14px; z-index: 6; display: flex;
      flex-direction: column; gap: 8px; padding: 10px 12px; min-width: 220px;
      border-radius: 8px; background: rgba(20, 24, 30, 0.78); backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32); }
    #controls .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #controls label { flex: 0 0 auto; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
    #controls input[type="range"] { flex: 1; accent-color: #5fb6ff; }
    #controls .val { flex: 0 0 40px; text-align: right; font-variant-numeric: tabular-nums; color: #cfe9ff; }
    #filters { position: fixed; left: 14px; top: 56px; z-index: 5; display: flex;
      flex-direction: column; gap: 10px; padding: 10px 12px; max-width: 280px;
      border-radius: 8px; background: rgba(20, 24, 30, 0.78); backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32); }
    #filters .group-label { opacity: 0.6; text-transform: uppercase; letter-spacing: 0.08em;
      font-size: 10px; font-weight: 800; }
    #filters .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    #filters .chip { padding: 4px 9px; border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04); color: rgba(240, 243, 245, 0.86);
      border-radius: 999px; font: 700 11px/1.2 inherit; letter-spacing: 0.04em;
      cursor: pointer; transition: background 120ms, border-color 120ms; }
    #filters .chip:hover { background: rgba(255, 255, 255, 0.08); }
    #filters .chip.active { background: rgba(95, 182, 255, 0.22);
      border-color: rgba(95, 182, 255, 0.6); color: #eaf5ff; }
    #filters .chip[data-disabled="1"] { opacity: 0.4; cursor: not-allowed; }
    #infocard { position: fixed; right: 14px; top: 56px; z-index: 6; padding: 12px 14px;
      min-width: 200px; max-width: 320px; border-radius: 8px;
      background: rgba(20, 24, 30, 0.86); backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.36); display: none; }
    #infocard .ic-title { font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; opacity: 0.6; margin-bottom: 6px; }
    #infocard .ic-row { font-size: 12px; line-height: 1.55; color: rgba(240, 243, 245, 0.9); }
    #infocard .ic-row b { color: rgba(95, 182, 255, 0.95); font-weight: 700; }
    #log { position: fixed; left: 14px; bottom: 14px; z-index: 5; padding: 6px 10px;
      border-radius: 6px; background: rgba(20, 24, 30, 0.62); backdrop-filter: blur(8px);
      max-width: 50vw; font-family: ui-monospace, Consolas, monospace; font-size: 11px;
      opacity: 0.85; white-space: pre; max-height: 30vh; overflow: auto; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <span id="title">BP3D · Pure</span>
  <div id="status">Initializing…</div>
  <div id="controls">
    <div class="row"><label for="exp">Exposure</label><input type="range" id="exp" min="0.4" max="2.4" step="0.02" value="1.18"><span class="val" id="expV">1.18</span></div>
    <div class="row"><label for="blm">Bloom</label><input type="range" id="blm" min="0" max="1.5" step="0.01" value="0.32"><span class="val" id="blmV">0.32</span></div>
    <div class="row"><label for="cnt">Contact</label><input type="range" id="cnt" min="0" max="1" step="0.02" value="0.78"><span class="val" id="cntV">0.78</span></div>
    <div class="row"><label for="pfx">PostFX</label><input type="checkbox" id="pfx"><span class="val" id="pfxV" style="flex:0 0 auto;font-size:10px;opacity:0.6">OFF</span></div>
  </div>
  <div id="filters" hidden>
    <div>
      <div class="group-label">Level</div>
      <div class="chips" id="levelChips"></div>
    </div>
    <div>
      <div class="group-label">System</div>
      <div class="chips" id="systemChips"></div>
    </div>
  </div>
  <div id="infocard">
    <div class="ic-title">Selected</div>
    <div class="ic-body"></div>
  </div>
  <pre id="log"></pre>

  <script type="module">
    const IFCS = [
      { url: "./samples/duplex-apartment/raw/Duplex_A_20110907.ifc",                label: "Architecture", system: "architecture", priority: 0 },
      { url: "./samples/duplex-apartment/raw/Duplex_M_20111024_ROOMS_AND_SPACES.ifc", label: "Rooms",       system: "spaces",       priority: 1 },
      { url: "./samples/duplex-apartment/raw/Duplex_Electrical_20121207.ifc",        label: "Electrical",  system: "electrical",   priority: 2 },
      { url: "./samples/duplex-apartment/raw/Duplex_MEP_20110907.ifc",               label: "Mechanical",  system: "hvac",         priority: 2 },
      { url: "./samples/duplex-apartment/raw/Duplex_Plumbing_20121113.ifc",          label: "Plumbing",    system: "plumbing",     priority: 3 }
    ];
    const $status = document.querySelector("#status");
    const $log = document.querySelector("#log");
    const setStatus = (txt, warn = false) => { $status.textContent = txt; $status.classList.toggle("warn", warn); };
    const log = (txt) => { $log.textContent += txt + "\n"; $log.scrollTop = $log.scrollHeight; console.info("[bp3d-pure]", txt); };

    window.addEventListener("error", (e) => log(`ERROR: ${e.message}`));
    window.addEventListener("unhandledrejection", (e) => log(`PROMISE-REJ: ${e.reason && e.reason.message ? e.reason.message : e.reason}`));

    (async () => {
      try {
        setStatus("Loading renderer module…");
        const mod = await import("./scripts/bp3d-real-renderer.js");
        log("renderer module loaded");

        const canvas = document.querySelector("#canvas");
        setStatus("Initializing renderer…");
        const api = await mod.createRealRenderer(canvas);
        // Expose for the smoke test and live debugging. Pure is by design a
        // diagnostic surface — keeping a window handle is cheap and lets
        // external scripts inspect mesh visibility without monkey-patching.
        window.__bp3dApi = api;
        log("renderer created");

        // Slider wiring
        const wire = (id, valId, fn) => {
          const s = document.querySelector(id), v = document.querySelector(valId);
          const sync = () => { const x = parseFloat(s.value); v.textContent = x.toFixed(2); fn(x); };
          s.addEventListener("input", sync); sync();
        };
        wire("#exp", "#expV", (v) => api.setExposure(v));
        wire("#blm", "#blmV", (v) => api.setBloom(v));
        wire("#cnt", "#cntV", (v) => api.setContactShadowOpacity(v));

        // PostFX toggle
        const pfxCheck = document.querySelector("#pfx");
        const pfxLabel = document.querySelector("#pfxV");
        pfxCheck.addEventListener("change", () => {
          api.setPostProcessing(pfxCheck.checked);
          pfxLabel.textContent = pfxCheck.checked ? "ON" : "OFF";
        });

        // ---- Picking → infocard ----
        const IFC_TYPE_NAMES = {
          2391406946: "Wall", 3512223829: "WallStandardCase",
          1529196076: "Slab", 3027962421: "SlabStandardCase",
          395920057: "Door", 3304561284: "Window",
          263784265: "FurnishingElement", 331165859: "Stair",
          901063453: "Column", 753842376: "Beam",
          3612865200: "PipeSegment", 310824031: "PipeFitting",
          3518393246: "DuctSegment", 342316401: "DuctFitting",
          3758799889: "CableSegment", 2223149337: "FlowTerminal",
          629592764: "LightFixture", 76236018: "Lamp",
          4207607924: "Valve", 1634111441: "AirTerminal",
          3053780830: "SanitaryTerminal", 2016517767: "Roof",
          1973544240: "Covering", 2262370178: "Railing"
        };
        const $card = document.querySelector("#infocard");
        const $cardBody = $card.querySelector(".ic-body");
        api.onSelect((info) => {
          if (!info) {
            $card.style.display = "none";
            return;
          }
          const typeName = IFC_TYPE_NAMES[info.ifcType] || `IFC#${info.ifcType || "?"}`;
          const pos = info.position;
          $cardBody.innerHTML = [
            `<div class="ic-row"><b>Type</b> ${typeName}</div>`,
            `<div class="ic-row"><b>System</b> ${info.system || "—"}</div>`,
            pos ? `<div class="ic-row"><b>Position</b> (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})</div>` : ""
          ].join("");
          $card.style.display = "block";
        });

        // ---- Filter chips (level + system) ----
        // Loaded in parallel with the IFC blocking phase. Level layers are
        // computed from canonicalLevels[].elevation using the duplex.html
        // convention: each layer occupies the half-way region to its neighbours.
        const SYSTEM_LABELS = {
          architecture: "Architecture",
          spaces: "Rooms",
          electrical: "Electrical",
          hvac: "Mechanical",
          plumbing: "Plumbing"
        };
        let activeLevel = "all";       // level id string or "all"
        const systemActive = new Map(IFCS.map((c) => [c.system, true]));

        const payloadPromise = fetch("./samples/duplex-apartment/derived/viewer-payload.json")
          .then((r) => r.ok ? r.json() : Promise.reject(new Error(`payload ${r.status}`)))
          .catch((e) => { log(`payload load failed: ${e.message || e}`); return null; });

        function buildLevelLayers(payload) {
          const sorted = (payload?.canonicalLevels || [])
            .filter((l) => Number.isFinite(l.elevation))
            .sort((a, b) => a.elevation - b.elevation);
          return sorted.map((level, i) => {
            const prev = sorted[i - 1], next = sorted[i + 1];
            return {
              id: level.id,
              name: level.name,
              elevation: level.elevation,
              min: prev ? (prev.elevation + level.elevation) / 2 : -Infinity,
              max: next ? (level.elevation + next.elevation) / 2 : Infinity
            };
          });
        }

        function applyLevel(layers) {
          if (activeLevel === "all") {
            api.setLevelFilter(null);
            return;
          }
          const layer = layers.find((l) => l.id === activeLevel);
          if (!layer) { api.setLevelFilter(null); return; }
          api.setLevelFilter({ min: layer.min, max: layer.max });
        }

        function renderLevelChips(layers) {
          const host = document.querySelector("#levelChips");
          host.innerHTML = "";
          const entries = [{ id: "all", name: "All" }, ...layers.map((l) => ({
            id: l.id, name: `${l.name} ${l.elevation.toFixed(2)}m`
          }))];
          entries.forEach((entry) => {
            const btn = document.createElement("button");
            btn.className = "chip" + (entry.id === activeLevel ? " active" : "");
            btn.textContent = entry.name;
            btn.dataset.level = entry.id;
            btn.addEventListener("click", () => {
              activeLevel = entry.id;
              applyLevel(layers);
              renderLevelChips(layers);
            });
            host.appendChild(btn);
          });
        }

        function renderSystemChips(payload) {
          const host = document.querySelector("#systemChips");
          host.innerHTML = "";
          // Keep the order Architecture → Rooms → Electrical → Mechanical → Plumbing
          // to match the loading order; counts are taken from sourceSystemCounts
          // when available (note: viewer-payload uses "mep"/"rooms_spaces" while
          // the renderer uses "hvac"/"spaces" — handled inline).
          const counts = payload?.sourceSystemCounts || {};
          const countAlias = { hvac: "mep", spaces: "rooms_spaces" };
          IFCS.forEach((cfg) => {
            const sys = cfg.system;
            const lookup = countAlias[sys] || sys;
            const count = counts[lookup];
            const btn = document.createElement("button");
            btn.className = "chip" + (systemActive.get(sys) ? " active" : "");
            btn.textContent = count
              ? `${SYSTEM_LABELS[sys] || cfg.label} ${count}`
              : (SYSTEM_LABELS[sys] || cfg.label);
            btn.dataset.system = sys;
            btn.addEventListener("click", () => {
              const next = !systemActive.get(sys);
              systemActive.set(sys, next);
              api.setSystemVisibility(sys, next);
              btn.classList.toggle("active", next);
            });
            host.appendChild(btn);
          });
        }

        let levelLayers = [];
        payloadPromise.then((payload) => {
          if (!payload) return;
          levelLayers = buildLevelLayers(payload);
          document.querySelector("#filters").hidden = false;
          renderLevelChips(levelLayers);
          renderSystemChips(payload);
          log(`payload loaded · ${levelLayers.length} levels, ${(payload.canonicalSpaces || []).length} spaces`);
        });

        const sorted = [...IFCS].sort((a, b) => a.priority - b.priority);
        const blocking = sorted.filter(c => c.priority === 0);
        const background = sorted.filter(c => c.priority > 0);
        const t0 = performance.now();
        let total = 0;

        // Phase 1: blocking — Architecture so user sees house ASAP
        for (const cfg of blocking) {
          setStatus(`Loading ${cfg.label}…`);
          try {
            const t = performance.now();
            const res = await api.loadIfc(cfg.url, cfg.label, cfg.system);
            total += res.count;
            log(`${cfg.label} +${res.count} meshes in ${((performance.now() - t) / 1000).toFixed(1)}s`);
          } catch (err) {
            log(`${cfg.label} FAILED: ${err.message || err}`);
          }
        }
        api.fit();
        try { api.regenerateContactShadow(); log("contact shadow regenerated (phase 1)"); }
        catch (e) { log(`contact shadow err: ${e.message || e}`); }
        const dt0 = ((performance.now() - t0) / 1000).toFixed(1);
        setStatus(background.length
          ? `Architecture ready · ${total} meshes · ${dt0}s — streaming MEP…`
          : `${total} meshes · ${dt0}s · drag to orbit`);

        // Phase 2: background streaming
        for (const cfg of background) {
          try {
            const t = performance.now();
            setStatus(`${total} meshes · streaming ${cfg.label}…`);
            const res = await api.loadIfc(cfg.url, cfg.label, cfg.system);
            total += res.count;
            log(`${cfg.label} +${res.count} meshes in ${((performance.now() - t) / 1000).toFixed(1)}s`);
          } catch (err) {
            log(`${cfg.label} FAILED: ${err.message || err}`);
          }
        }
        try { api.regenerateContactShadow(); log("contact shadow regenerated (phase 2)"); }
        catch (e) { log(`contact shadow err: ${e.message || e}`); }
        const dt = ((performance.now() - t0) / 1000).toFixed(1);
        setStatus(`${total} meshes · ${dt}s · drag to orbit, wheel to zoom`);
      } catch (err) {
        console.error(err);
        setStatus(`Failed: ${err.message || err}`, true);
        log(`FATAL: ${err.message || err}\n${err.stack || ""}`);
      }
    })();
  </script>
</body>
</html>
